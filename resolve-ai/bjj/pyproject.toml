[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bjj-pipeline"
version = "0.2.0"
description = "Blue Belt Media - AI-assisted Brazilian jiu-jitsu tournament footage pipeline for DaVinci Resolve (organize, analyze, rank, plan, export EDL, build timelines, render presets)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
# Deep-learning assisted detectors (pose / person detection). Installed in the
# SAME venv only when the user opts in; the heuristic analyzer never needs them.
detect = [
  "ultralytics>=8.3",
  "opencv-python-headless>=4.9",
]
dev = [
  "pytest>=8",
]
# BBM Studio optional extras: OpenCV for optical-flow camera moves in reference breakdowns,
# OpenTimelineIO only to validate .otio exports in tests. The studio itself needs numpy + FFmpeg.
studio = [
  "opencv-python-headless>=4.9",
  "opentimelineio>=0.17",
]

[project.scripts]
bjj = "bjj_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bjj_pipeline*"]

[tool.setuptools.package-data]
"bjj_pipeline.studio" = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
